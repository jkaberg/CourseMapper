name: Release

on:
  push:
    tags:
      - "*"
  # dry run from the Actions tab, publishing is skipped without a tag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    # signing secrets live in this environment
    environment: release

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      # the executable bit gets lost on Windows
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from the tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty. It must exist in the 'release' environment (Settings -> Environments -> release -> Environment secrets), not as a repository variable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the release APK
        env:
          VERSION_NAME:      ${{ steps.version.outputs.name }}
          KEYSTORE_PATH:     ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # a missing signing config renames the output instead of failing
      - name: Verify the APK is signed, and name it after the tag
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK is missing, the build produced an unsigned APK. Check the signing secrets."
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          OUT="CourseMapper-${{ steps.version.outputs.name }}.apk"
          mv "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name:               ${{ github.ref_name }}
          name:                   ${{ github.ref_name }}
          generate_release_notes: true
          files:                  ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      # dry runs keep the APK as an artifact
      - name: Upload the APK as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}
